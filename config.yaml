experiment:
  name: tree_based_healthcare_risk_comparison
  random_state: 42
  decision_threshold: 0.50
  primary_metric: pr_auc
  balance_training: true
  output_dir: results/model_evaluation
  cv:
    n_splits: 5
    shuffle: true

# The upstream data pipeline already creates one development/train file and one
# untouched test file per dataset. All model experiments consume those processed
# numeric files so the three algorithms see exactly the same features and rows.
datasets:
  dataset1:
    name: Personal Key Indicators of Heart Disease (2022)
    train_path: data/processed/dataset1/train.csv
    test_path: data/processed/dataset1/test.csv
    target_column: HadHeartAttack
  dataset2:
    name: Heart Failure Prediction
    train_path: data/processed/dataset2/train.csv
    test_path: data/processed/dataset2/test.csv
    target_column: HeartDisease
  dataset3:
    name: Heart Disease Health Indicators (BRFSS 2015)
    train_path: data/processed/dataset3/train.csv
    test_path: data/processed/dataset3/test.csv
    target_column: HeartDiseaseorAttack

# Fixed, literature-guided configurations are intentionally shared across all
# three datasets. This keeps RQ1/RQ2 focused on model and fold variability rather
# than allowing each dataset to receive a separately optimized configuration.
models:
  adaboost:
    display_name: AdaBoost
    params:
      estimator:
        max_depth: 1
      n_estimators: 200
      learning_rate: 0.10

  xgboost:
    display_name: XGBoost
    params:
      objective: binary:logistic
      eval_metric: logloss
      n_estimators: 300
      learning_rate: 0.05
      max_depth: 4
      min_child_weight: 1
      subsample: 0.80
      colsample_bytree: 0.80
      reg_alpha: 0.0
      reg_lambda: 1.0
      tree_method: hist
      n_jobs: -1
      verbosity: 0

  lightgbm:
    display_name: LightGBM
    params:
      objective: binary
      n_estimators: 300
      learning_rate: 0.05
      num_leaves: 31
      max_depth: 6
      min_child_samples: 20
      subsample: 0.80
      subsample_freq: 1
      colsample_bytree: 0.80
      reg_alpha: 0.0
      reg_lambda: 1.0
      n_jobs: -1
      verbosity: -1
      deterministic: true
      force_col_wise: true
